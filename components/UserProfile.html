<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <link rel="stylesheet" href="/css/header.css" />
     <link
      rel="shortcut icon"
      href="/assets/nature.png"
      type="image/x-icon"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Truculenta:opsz,wght@12..72,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/userprofile.css" />
    <script src="/js/header.js" defer></script>
    <script src="/js/userProfile.js" defer></script>
  </head>
  <body>
  <header>
  <div class="web-logo">
    <img src="/assets/logo-transparent-svg.svg" alt="logo" onclick="window.location.href= '../index.html'" />
  </div>

  <nav>
    <ul>
      <li class="nav-link"><a href="../index.html">Home</a></li>
      <li class="nav-link"><a href="/components/donate.html">Browse Fundraiser</a></li>
      <li class="nav-link"><a href="/components/How_it_works.html">How it Works</a></li>
      <li class="nav-link"><a href="/components/About.html">About Us</a></li>
    </ul>
  </nav>

  <div class="header-right">
    <div class="user-section" id="user-section" style="display:none;">
      <img id="user-logo" src="" alt="User Logo" onclick="window.location.href='/components/UserProfile.html'" />
      <span id="user-name"></span>
    </div>

    <div class="login-small">
      <button class="dropbtn" id="login-btn"><i class="fas fa-bars"></i></button>
      <div class="dropdown-content" id="content">
        <div class="login-s">
          <a href="#" onclick="showLoginPage('login')">Login</a>
          <a href="#" onclick="showLoginPage('signup')">Sign Up</a>
        </div>
        <div class="nav-small">
          <ul>
            <li class="nav-link"><a href="../index.html">Home</a></li>
            <li class="nav-link"><a href="/components/donate.html">Browse Fundraiser</a></li>
            <li class="nav-link"><a href="/components/How_it_works.html">How it Works</a></li>
            <li class="nav-link"><a href="/components/About.html">About Us</a></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="login-btn" id="login-buttons">
      <button onclick="showLoginPage('login')">Log In</button>
      <button onclick="showLoginPage('signup')">Sign Up</button>
    </div>
  </div>
</header>
    <main>
      <section class="user-profile">
        <section class="user-details">
          <div class="user-img">
            <img
              src="/assets/single-man-icon-people-icon-user-profile-symbol-person-symbol-businessman-stock-vector.jpg"
              alt=""
            />
          </div>
          <section class="user-info">
            <h2 class="user-name"></h2>
            <span class="user-location"></span>

            <div class="stats">
              <span>Donations Made: 0</span>
              <span>Campaigns Started: 0</span>
            </div>
            <button id="logout-btn">Logout</button>
          </section>
          <button type="button" class="edit-btn">Edit</button>
          <i class="fas fa-ellipsis-v"></i>
        </section>
        <h1>About Me</h1>
        <section class="user-bio">
          
        </section>
      </section>
      <div id="editModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <h2>Edit Profile</h2>
   <form id="edit-profile-form" enctype="multipart/form-data">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" value="Radhika" required />
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" value="example@email.com" />
  <label for="password">Password:</label>
  <input type="password" id="password" name="password" />
  <label for="location">Location:</label>
  <input type="text" id="location" name="location" value="Rajpura" />
  <label for="bio">About Me:</label>
  <textarea id="bio" name="bio" rows="4">Lorem ipsum dolor sit amet consectetur...</textarea>
  <label for="profileImage">Profile Image:</label>
  <input type="file" id="profileImage" name="profileImage" accept="image/*" />

  <button type="submit">Save Changes</button>
</form>

  </div>
</div>
<h1>My Donations</h1>
<section class="user-donations">
  <div class="donation-card placeholder">
    <div class="donation-img"></div>
    <div class="donation-info">
      <h3></h3>
      <p></p>
      <p></p>
      <span class="status"></span>
    </div>
    <a href="#" class="receipt-link"></a>
  </div>
  <div class="donation-card placeholder"></div>
  <div class="donation-card placeholder"></div>
  <div class="donation-card placeholder"></div>
</section>

<h1>My Campaigns</h1>
<section class="user-campaigns">
  <div class="campaign-card placeholder">
    <div class="camp-img"></div>
    <div class="campaign-content">
      <h3 class="camp-heading"></h3>
      <p></p>
      <div class="progress-bar">
        <div class="progress"></div>
      </div>
      <div class="campaign-stats">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="actions">
        <a href="#"></a>
        <a href="#"></a>
        <a href="#"></a>
      </div>
    </div>
  </div>
  <div class="campaign-card placeholder"></div>
  <div class="campaign-card placeholder"></div>
  <div class="campaign-card placeholder"></div>
</section>


      <section class="settings-section"></section>
    </main>

  </body>
</html>
